      name="description"
      content="Visit Duo Cafe in Manhattan's East Village for table-side brewed tea tasting flights, seasonal matcha basque cheesecakes, and artisanal mousse desserts."

      property="og:title"
      content="Duo Cafe | Tea Flights & Seasonal Cakes"

      property="og:description"
      content="The coziest tea house in NYC. Handcrafted matcha basques and custom tea flights."
    />
